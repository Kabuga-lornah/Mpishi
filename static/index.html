<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mpishi</title>

<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#090b0d">
<link rel="apple-touch-icon" href="/static/icon-192.png">

<style>
/* =========================================================
   MPISHI — PREMIUM SMART APPLIANCE UI
   Visual layer only.
   Existing IDs and JavaScript behavior are preserved.
   ========================================================= */

:root{
  --bg:#080a0c;
  --surface:#101315;
  --surface-2:#15191c;
  --surface-3:#1b2023;
  --surface-4:#22282c;

  --line:rgba(255,255,255,.10);
  --line-strong:rgba(255,255,255,.18);

  --text:#f4f5f5;
  --text-soft:#c4c9cc;
  --muted:#7e878d;

  --accent:#f3f4f4;
  --accent-dark:#0d1012;

  --blue:#58a6ff;
  --green:#62d39b;
  --green-bg:rgba(98,211,155,.11);

  --amber:#e5a84b;
  --amber-bg:rgba(229,168,75,.12);

  --red:#ff5c5c;
  --red-bg:rgba(255,92,92,.12);

  --shadow:0 25px 80px rgba(0,0,0,.45);

  --radius-xl:28px;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
  color-scheme:dark;
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -15%,rgba(255,255,255,.075),transparent 32%),
    linear-gradient(180deg,#0b0d0f 0%,#07090a 100%);
  color:var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  font-size:16px;
  line-height:1.45;
}

/* =========================================================
   TYPOGRAPHY
   ========================================================= */

h1,
h2,
button,
#status,
.word,
.chip,
#timer{
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

h1,
h2,
p{
  margin-top:0;
}

/* =========================================================
   GLOBAL HEADER
   ========================================================= */

.top{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:sticky;
  top:0;
  z-index:30;

  background:
    linear-gradient(
      180deg,
      rgba(12,15,17,.98),
      rgba(12,15,17,.91)
    );

  border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.top::before{
  content:"";
  position:absolute;
  left:28px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 14px rgba(98,211,155,.75);
}

.top svg{
  width:22px;
  height:22px;
  margin-right:8px;
}

.word{
  font-size:1.15rem;
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
}

/* =========================================================
   PAGE
   ========================================================= */

main{
  width:min(1380px,100%);
  margin:0 auto;
  padding:38px 30px 70px;
}

/* =========================================================
   SETUP SCREEN
   ========================================================= */

.setup{
  min-height:calc(100vh - 160px);
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);
  gap:70px;
  align-items:center;
}

.setup > div:first-child{
  position:relative;
  padding:35px 0;
}

.setup > div:first-child::before{
  content:"MPISHI";
  display:block;
  margin-bottom:26px;

  color:#6f777c;
  font-size:.72rem;
  font-weight:700;
  letter-spacing:.35em;
  text-transform:uppercase;
}

.setup h1{
  max-width:720px;
  margin:0 0 22px;

  font-size:
    clamp(3rem,6vw,6.4rem);

  line-height:.94;
  letter-spacing:-.055em;
  font-weight:700;
}

.fine{
  max-width:560px;
  color:var(--muted);
  font-size:1rem;
  line-height:1.7;
}


/* =========================================================
   HOVERING PHOTO COLLAGE (replaces hero text)
   ========================================================= */

.sr-only{
  position:absolute!important;
  width:1px;height:1px;
  margin:-1px;padding:0;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

.setup > div.collage::before{
  content:none;
  display:none;
}

.collage{
  position:relative;
  width:100%;
  height:min(680px,78vh);
  min-height:520px;
  padding:0!important;
}

.shot{
  position:absolute;
  margin:0;
  overflow:hidden;

  border:1px solid var(--line-strong);
  border-radius:var(--radius-xl);

  background:var(--surface-2);

  box-shadow:
    0 30px 70px rgba(0,0,0,.55),
    inset 0 0 0 1px rgba(255,255,255,.04);

  animation:hover-float 7s ease-in-out infinite;
  transition:
    transform .45s cubic-bezier(.2,.8,.2,1),
    box-shadow .45s ease,
    border-color .3s ease;
  will-change:transform;
}

.shot img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:saturate(.92) contrast(1.02);
  transition:transform .8s cubic-bezier(.2,.8,.2,1),filter .4s ease;
}

.shot::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.35));
}

.shot:hover{
  z-index:10;
  animation-play-state:paused;
  transform:translateY(-10px) scale(1.04);
  border-color:rgba(255,255,255,.4);
  box-shadow:
    0 40px 90px rgba(0,0,0,.65),
    0 0 0 1px rgba(255,255,255,.08);
}

.shot:hover img{
  transform:scale(1.06);
  filter:saturate(1.05) contrast(1.04);
}

/* tall portrait, left */
.shot-elder{
  top:0;
  left:0;
  width:41%;
  height:74%;
  z-index:2;
  animation-delay:-1s;
}

/* wide, top right */
.shot-mother{
  top:7%;
  right:0;
  width:57%;
  height:44%;
  z-index:3;
  animation-duration:8s;
  animation-delay:-3.5s;
}

/* wide, bottom */
.shot-chair{
  bottom:0;
  right:6%;
  width:62%;
  height:44%;
  z-index:4;
  animation-duration:9s;
  animation-delay:-5.5s;
}

@keyframes hover-float{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  50%{ transform:translateY(-14px) rotate(.4deg); }
}

@media(max-width:1050px){
  .collage{
    height:560px;
    min-height:0;
  }
}

@media(max-width:680px){
  .collage{
    height:460px;
  }
  .shot{
    border-radius:20px;
  }
}

/* =========================================================
   SETUP CONTROL PANEL
   ========================================================= */

.setup > div:last-child{
  position:relative;

  padding:30px;
  border:1px solid var(--line);
  border-radius:var(--radius-xl);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.015)
    );

  box-shadow:var(--shadow);
}

.setup > div:last-child::before{
  content:"COOKING SETUP";
  display:block;
  margin-bottom:24px;

  color:#737c81;
  font-size:.68rem;
  font-weight:700;
  letter-spacing:.28em;
}

/* =========================================================
   FORM CONTROLS
   ========================================================= */

label{
  display:block;
  margin:20px 0 8px;

  color:#b8bec2;
  font-size:.76rem;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
}

input,
select{
  width:100%;
  min-height:50px;

  padding:0 15px;

  border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);

  background:#0c0f11;
  color:var(--text);

  font:inherit;

  outline:none;

  transition:
    border-color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

input::placeholder{
  color:#5f676c;
}

input:hover,
select:hover{
  background:#101416;
  border-color:rgba(255,255,255,.25);
}

input:focus,
select:focus{
  border-color:rgba(255,255,255,.55);
  background:#111518;
  box-shadow:0 0 0 3px rgba(255,255,255,.05);
}

input[type=checkbox]{
  width:18px;
  min-height:18px;
  margin:0 10px 0 0;
  accent-color:#fff;
}

.check{
  display:flex;
  align-items:center;
  margin-top:20px;

  color:#929a9f;
  font-size:.78rem;
  font-weight:500;
  letter-spacing:0;
  text-transform:none;
}

/* =========================================================
   BUTTONS
   ========================================================= */

button{
  width:100%;
  min-height:52px;

  margin-top:14px;
  padding:0 18px;

  border:1px solid transparent;
  border-radius:var(--radius-sm);

  background:#f1f2f2;
  color:#090b0d;

  font-size:.86rem;
  font-weight:700;
  letter-spacing:.025em;

  cursor:pointer;

  transition:
    transform .18s ease,
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

button:hover{
  background:#fff;
  transform:translateY(-1px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

button:active{
  transform:translateY(0);
}

button.secondary{
  background:#15191c;
  color:#e5e7e8;
  border-color:var(--line-strong);
}

button.secondary:hover{
  background:#202529;
}

#start{
  min-height:60px;
  margin-top:24px;

  background:#f4f5f5;
  color:#090b0d;

  font-size:.92rem;
  letter-spacing:.04em;
  text-transform:uppercase;
}

#start:hover{
  background:#fff;
}

/* =========================================================
   FOCUS
   ========================================================= */

:focus-visible{
  outline:none;
  box-shadow:
    0 0 0 2px #090b0d,
    0 0 0 5px rgba(255,255,255,.75);
}

/* =========================================================
   WARNING
   ========================================================= */

.warn{
  margin-top:16px;
  padding:13px 15px;

  border:1px solid rgba(229,168,75,.35);
  border-radius:var(--radius-sm);

  background:var(--amber-bg);
  color:#e9bd78;

  font-size:.85rem;
}

/* =========================================================
   LIVE EXPERIENCE
   ========================================================= */

.live{
  display:grid;
  grid-template-columns:minmax(0,1.45fr) minmax(320px,.55fr);
  gap:22px;
  align-items:start;
}

/* =========================================================
   MAIN CAMERA / APPLIANCE SCREEN
   ========================================================= */

.stage{
  min-width:0;
}

.screen{
  position:relative;
  overflow:hidden;

  border:1px solid var(--line);
  border-radius:var(--radius-xl);

  background:#000;

  box-shadow:
    0 30px 90px rgba(0,0,0,.45),
    inset 0 0 0 1px rgba(255,255,255,.025);
}

.screen::after{
  content:"";
  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.38) 0%,
      transparent 18%,
      transparent 75%,
      rgba(0,0,0,.38) 100%
    );
}

video{
  display:block;
  width:100%;
  aspect-ratio:16/10;
  min-height:500px;
  object-fit:cover;

  background:#020303;
}

/* =========================================================
   CAMERA CHIPS
   ========================================================= */

.chip{
  position:absolute;
  z-index:5;

  display:inline-flex;
  align-items:center;

  min-height:34px;
  padding:0 13px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:999px;

  background:rgba(9,11,13,.78);
  color:#f1f3f3;

  font-size:.7rem;
  font-weight:650;
  letter-spacing:.03em;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

#watchingBadge{
  top:18px;
  left:18px;
}

#watchingBadge::before{
  content:"";
  width:7px;
  height:7px;

  margin-right:8px;

  border-radius:50%;

  background:var(--green);
  box-shadow:0 0 12px rgba(98,211,155,.8);

  animation:breathe 2.4s ease-in-out infinite;
}

#presence{
  top:18px;
  right:18px;
}

#presence.away{
  background:rgba(92,57,14,.88);
  border-color:rgba(229,168,75,.35);
  color:#f1c67f;
}

#demobadge{
  bottom:18px;
  left:18px;

  background:rgba(82,57,18,.88);
  border-color:rgba(229,168,75,.35);
  color:#f1c67f;
}

/* =========================================================
   STATUS PANEL
   ========================================================= */

#status{
  position:relative;

  min-height:92px;

  margin-top:12px;
  padding:20px 22px;

  border:1px solid var(--line);
  border-radius:var(--radius-lg);

  background:
    linear-gradient(
      145deg,
      rgba(98,211,155,.11),
      rgba(98,211,155,.035)
    );

  color:#e8f8ef;

  font-size:1.12rem;
  font-weight:650;
  line-height:1.35;

  box-shadow:0 14px 40px rgba(0,0,0,.2);
}

#status::before{
  content:"";
  display:inline-block;

  width:9px;
  height:9px;

  margin-right:10px;

  vertical-align:2px;

  border-radius:50%;

  background:var(--green);
  box-shadow:0 0 14px rgba(98,211,155,.65);
}

#status.watch{
  background:
    linear-gradient(
      145deg,
      rgba(229,168,75,.14),
      rgba(229,168,75,.035)
    );

  border-color:rgba(229,168,75,.25);
  color:#f2d29e;
}

#status.watch::before{
  background:var(--amber);
  box-shadow:0 0 14px rgba(229,168,75,.55);
}

#status.alert{
  background:
    linear-gradient(
      145deg,
      rgba(255,92,92,.19),
      rgba(255,92,92,.06)
    );

  border-color:rgba(255,92,92,.38);
  color:#fff;

  animation:ring 1.6s ease-out infinite;
}

#status.alert::before{
  background:var(--red);
  box-shadow:0 0 16px rgba(255,92,92,.8);
}

#status small{
  display:block;

  margin-top:7px;

  color:rgba(255,255,255,.55);

  font-size:.72rem;
  font-weight:450;
}

/* =========================================================
   TIMER
   ========================================================= */

#timer{
  min-height:28px;

  margin:14px 3px 0;

  color:#aeb5b9;

  font-size:1.05rem;
  font-weight:600;

  font-variant-numeric:tabular-nums;
  letter-spacing:.04em;
}

/* =========================================================
   RIGHT SIDE CONTROL PANEL
   ========================================================= */

.side{
  position:relative;

  min-width:0;
  padding:20px;

  border:1px solid var(--line);
  border-radius:var(--radius-xl);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.04),
      rgba(255,255,255,.012)
    );

  box-shadow:var(--shadow);
}

.side::before{
  content:"MPISHI CONTROL";
  display:block;

  margin-bottom:20px;

  color:#70797e;

  font-size:.66rem;
  font-weight:750;
  letter-spacing:.3em;
}

/* =========================================================
   COOKING GUIDE
   ========================================================= */

#planbox{
  margin-bottom:24px;
  padding-bottom:20px;

  border-bottom:1px solid var(--line);
}

#planbox h2{
  margin:0 0 12px;

  color:#e7eaeb;

  font-size:.78rem;
  font-weight:700;
  letter-spacing:.11em;
  text-transform:uppercase;
}

#plan{
  list-style:none;

  margin:0;
  padding:0;

  border-top:1px solid var(--line);
}

#plan li{
  padding:11px 4px;

  border-bottom:1px solid var(--line);

  color:#9ca5aa;

  font-size:.79rem;
  line-height:1.5;
}

#plan li:first-child{
  color:#f0f2f2;
  font-weight:700;
}

/* =========================================================
   SIDE INPUTS
   ========================================================= */

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;

  margin-top:9px;
}

.row input{
  min-width:0;
}

.row button{
  width:auto;
  min-width:72px;

  margin:0;
}

/* =========================================================
   ACTIVITY LOG
   ========================================================= */

#log{
  max-height:330px;
  overflow:auto;

  list-style:none;

  margin:22px 0 0;
  padding:0;

  border-top:1px solid var(--line);

  scrollbar-width:thin;
  scrollbar-color:#343b40 transparent;
}

#log li{
  display:grid;
  grid-template-columns:55px 1fr;
  gap:10px;

  padding:10px 0;

  border-bottom:1px solid rgba(255,255,255,.055);

  color:#8f989d;

  font-size:.74rem;
  line-height:1.5;
}

#log time{
  color:#555f64;

  font-size:.67rem;
  font-variant-numeric:tabular-nums;
}

/* =========================================================
   OFFLINE ALERT
   ========================================================= */

#offline{
  position:fixed;
  top:0;
  right:0;
  left:0;

  z-index:100;

  padding:15px 20px;

  border-bottom:1px solid rgba(255,255,255,.15);

  background:
    linear-gradient(
      90deg,
      #4c1111,
      #7e1717
    );

  color:#fff;

  text-align:center;

  box-shadow:0 12px 35px rgba(0,0,0,.45);
}

#offline span{
  display:block;

  font-size:.82rem;
  font-weight:750;
  letter-spacing:.12em;
}

#offline small{
  display:block;

  margin-top:3px;

  color:rgba(255,255,255,.72);

  font-size:.76rem;
}

/* =========================================================
   UTILITIES
   ========================================================= */

.hidden{
  display:none!important;
}

/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes breathe{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.4;
    transform:scale(.8);
  }
}

@keyframes ring{
  0%{
    box-shadow:0 0 0 0 rgba(255,92,92,.35);
  }

  100%{
    box-shadow:0 0 0 18px rgba(255,92,92,0);
  }
}

/* =========================================================
   TABLET
   ========================================================= */

@media(max-width:1050px){

  main{
    padding:28px 22px 60px;
  }

  .setup{
    grid-template-columns:1fr;
    gap:30px;
    align-items:start;
  }

  .setup > div:first-child{
    padding:10px 0;
  }

  .setup h1{
    max-width:700px;
    font-size:clamp(3rem,9vw,5rem);
  }

  .live{
    grid-template-columns:1fr;
  }

  video{
    min-height:420px;
  }

  .side{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
  }

  .side::before{
    display:none;
  }

  #planbox{
    margin:0;
    padding:0;
    border:0;
  }

  #log{
    margin-top:10px;
  }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:680px){

  .top{
    height:60px;
  }

  .top::before{
    left:18px;
  }

  main{
    padding:20px 14px 45px;
  }

  .setup{
    min-height:auto;
  }

  .setup h1{
    font-size:clamp(2.8rem,13vw,4rem);
  }

  .setup > div:last-child{
    padding:20px;
    border-radius:20px;
  }

  .live{
    gap:12px;
  }

  .screen{
    border-radius:20px;
  }

  video{
    min-height:270px;
    aspect-ratio:4/3;
  }

  .chip{
    min-height:30px;
    padding:0 10px;
    font-size:.61rem;
  }

  #watchingBadge{
    top:10px;
    left:10px;
  }

  #presence{
    top:10px;
    right:10px;
  }

  #demobadge{
    bottom:10px;
    left:10px;
  }

  #status{
    min-height:84px;
    padding:17px;
    border-radius:16px;
    font-size:1rem;
  }

  .side{
    display:block;
    padding:18px;
    border-radius:20px;
  }

  #planbox{
    margin-bottom:20px;
    padding-bottom:15px;
    border-bottom:1px solid var(--line);
  }

  #log{
    max-height:230px;
  }
}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     OFFLINE / SAFETY BANNER
     ======================================================= -->

<div id="offline" class="hidden" role="alert">
  <span id="offlineTitle">MPISHI IS NOT WATCHING</span>
  <small id="offlineText">Please check the stove yourself.</small>
</div>

<!-- =======================================================
     TOP BAR
     ======================================================= -->

<header class="top">

  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path
      fill="#ffffff"
      d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-6 .5 1.5 1.5 2 2 1 .5-2 0-4 1-7z"
    />
    <path
      fill="#080a0c"
      d="M12 22a3 3 0 0 1-3-3c0-2 2-3 3-5 1 2 3 3 3 5a3 3 0 0 1-3 3z"
    />
  </svg>

  <span class="word">Mpishi</span>

</header>

<script>
const UI = {
  en:{
    codeLabel:"Access code", wrongCode:"Wrong access code.", near:"Someone is near the stove", away:"Nobody near the stove",
    subtitle:"An extra set of eyes on your stove. Not a smoke alarm.", foodLabel:"What are you cooking? (optional)", foodPlaceholder:"e.g. potato fries in oil", goalLabel:"Tell me when... (optional)", goalPlaceholder:"e.g. the fries are golden", prefLabel:"How do you like it? (optional)", prefPlaceholder:"e.g. steak medium, stew very tender", langLabel:"Language", demoLabel:"Demo mode: safety intervals accelerated", start:"Start watching", planning:"Planning your cook...", add:"Add", planningShort:"Planning...", ask:"Ask", stop:"Stop", addItem:"Add another item, e.g. steamed cabbage", askPlaceholder:"Ask: is it ready yet?", guide:"Cooking guide (estimates; check by hand)", watching:"● Mpishi is watching automatically", privacy:"Your camera is used for the active cooking session. Mpishi does not need a manual “I am leaving” button.", offlineTitle:"MPISHI IS NOT WATCHING", offlineText:"Please check the stove yourself.", startMessage:"Mpishi is watching. Point the camera at the cooking area.", starting:"Starting...", lastCheck:"Last check", cameraSecure:"The camera needs a secure page. Use localhost or an HTTPS link.", cameraBlocked:"Camera access was blocked. Allow camera access and try again.", connection:"I lost the connection. Please check the stove yourself.", timerDone:"Timer done. Check the food.", uncertain:"I am not sure. Please check the food yourself.", after:"after", min:"min", fromSearch:"from web search", fromMemory:"from model knowledge", noGuide:"no guide"
  },
  sw:{
    codeLabel:"Msimbo wa ufikiaji", wrongCode:"Msimbo si sahihi.", near:"Kuna mtu karibu na jiko", away:"Hakuna mtu karibu na jiko",
    subtitle:"Macho ya ziada ya kuangalia jiko lako. Si king'ora cha moshi.", foodLabel:"Unapika nini? (hiari)", foodPlaceholder:"mfano viazi vya kukaanga kwa mafuta", goalLabel:"Niambie wakati... (hiari)", goalPlaceholder:"mfano viazi viwe vya rangi ya dhahabu", prefLabel:"Unapenda chakula kiweje? (hiari)", prefPlaceholder:"mfano nyama iwe ya wastani, mchuzi mzito", langLabel:"Lugha", demoLabel:"Hali ya onyesho: vipindi vya tahadhari vimeharakishwa", start:"Anza kuangalia", planning:"Mpishi anapanga upishi wako...", add:"Ongeza", planningShort:"Inapanga...", ask:"Uliza", stop:"Simamisha", addItem:"Ongeza chakula kingine, kwa mfano kabeji ya mvuke", askPlaceholder:"Uliza: kimeiva tayari?", guide:"Mwongozo wa upishi (makadirio; hakikisha mwenyewe)", watching:"● Mpishi anaangalia kiotomatiki", privacy:"Kamera inatumika wakati wa upishi. Mpishi haihitaji kitufe cha kusema “nimeondoka”.", offlineTitle:"MPISHI HAANGALII", offlineText:"Tafadhali angalia jiko mwenyewe.", startMessage:"Mpishi anaangalia. Elekeza kamera kwenye sehemu ya kupikia.", starting:"Inaanza...", lastCheck:"Ukaguzi wa mwisho", cameraSecure:"Kamera inahitaji ukurasa salama. Tumia localhost au kiungo cha HTTPS.", cameraBlocked:"Kamera imezuiwa. Ruhusu matumizi ya kamera kisha ujaribu tena.", connection:"Nimepoteza muunganisho. Tafadhali angalia jiko mwenyewe.", timerDone:"Muda umekwisha. Angalia chakula.", uncertain:"Sina uhakika. Tafadhali angalia chakula mwenyewe.", after:"baada ya", min:"dak", fromSearch:"kutoka utafutaji wa wavuti", fromMemory:"kutoka maarifa ya modeli", noGuide:"hakuna mwongozo"
  }
};

let INTERVAL_MS=10000; const MAX_FAILS=3, REPEAT_MS=60000, SILENCE_MS=60000;
let code="", offShown=false, lastOk=0, holdUntil=0, demo=false, watchdog=null, sid=null, stream=null, loop=null, wake=null, fails=0, busy=false, cfg={}, goalDone=false;
let items=[], timerEnd=null, timerTick=null, lastSaid="", lastSaidAt=0, lang="en";
const $=id=>document.getElementById(id);
const ui=()=>UI[lang];

function applyLanguage(){
  const x=ui();
  document.documentElement.lang=lang==='sw'?'sw':'en';
  $('subtitle').textContent=x.subtitle; $('codeLabel').textContent=x.codeLabel; $('foodLabel').textContent=x.foodLabel; $('food').placeholder=x.foodPlaceholder;
  $('goalLabel').textContent=x.goalLabel; $('goal').placeholder=x.goalPlaceholder; $('prefLabel').textContent=x.prefLabel; $('pref').placeholder=x.prefPlaceholder;
  $('langLabel').textContent=x.langLabel; $('demoLabel').textContent=x.demoLabel; $('start').textContent=x.start; $('watchingBadge').textContent=x.watching.replace(/^\u25CF\s*/,'');
  $('guideTitle').textContent=x.guide; $('itemname').placeholder=x.addItem; $('itemname').setAttribute('aria-label',x.addItem); $('q').placeholder=x.askPlaceholder; $('q').setAttribute('aria-label',x.askPlaceholder);
  $('additem').textContent=x.add; $('ask').textContent=x.ask; $('stop').textContent=x.stop; $('offlineTitle').textContent=x.offlineTitle; $('offlineText').textContent=x.offlineText;
  $('privacyNote').textContent=x.privacy;
}

function speak(text){
  if(!text||!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(text); u.lang=lang==='sw'?'sw-KE':'en-KE';
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function show(state,text,note){
  const el=$('status'); el.className=state==='alert'?'alert':state==='watch'?'watch':''; el.textContent=text;
  if(note){const s=document.createElement('small');s.textContent=note;el.appendChild(s);}
}
function log(text){const li=document.createElement('li'),t=document.createElement('time'),s=document.createElement('span');t.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});s.textContent=text;li.append(t,s);$('log').prepend(li);}
function setPresence(p){const el=$('presence');el.textContent=p?ui().near:ui().away;el.className='chip '+(p?'near':'away');}
function announce(r){
  if(!r.say)return;
  const now=Date.now(), repeat=r.say===lastSaid&&now-lastSaidAt<REPEAT_MS;
  show(r.state,r.say);log(r.say);
  if(!repeat||r.state==='alert'){speak(r.say);lastSaid=r.say;lastSaidAt=now;}
}
function startTimer(sec){
  clearInterval(timerTick);timerEnd=Date.now()+sec*1000;
  timerTick=setInterval(()=>{const left=Math.max(0,Math.round((timerEnd-Date.now())/1000));$('timer').textContent=left?`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:ui().timerDone;if(!left){clearInterval(timerTick);show('watch',ui().timerDone);speak(ui().timerDone);log(ui().timerDone);}},500);
}
async function api(path,opts={}){
  const {timeout=60000,headers={},...o}=opts; const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);
  try{const res=await fetch(path,{...o,headers:{...headers,...(code?{'X-Access-Code':code}:{})},signal:ctl.signal});if(!res.ok){const err=new Error((await res.json().catch(()=>({}))).detail||res.status);err.status=res.status;throw err;}return await res.json();}
  finally{clearTimeout(timer);}
}
async function newSession(){const r=await api('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg),timeout:120000});sid=r.session_id;items=r.items||[];renderPlan();return r;}
function renderPlan(){const ul=$('plan');ul.innerHTML='';const x=ui();items.forEach(it=>{const h=document.createElement('li');h.textContent=it.name+(it.source==='web'?` (${x.fromSearch})`:it.source==='memory'?` (${x.fromMemory})`:` (${x.noGuide})`);h.style.fontWeight='bold';ul.appendChild(h);if(it.intro){const li=document.createElement('li');li.textContent=it.intro;ul.appendChild(li);}(it.checkpoints||[]).forEach(c=>{const li=document.createElement('li');li.textContent=`${x.after} ${c.at_minutes} ${x.min}: ${c.say}`;ul.appendChild(li);});});$('planbox').classList.toggle('hidden',!items.length);}
function grabFrame(){const v=$('cam');if(!v.videoWidth)return null;const c=document.createElement('canvas'),s=512/Math.max(v.videoWidth,v.videoHeight);c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);c.getContext('2d').drawImage(v,0,0,c.width,c.height);return new Promise(res=>c.toBlob(res,'image/jpeg',0.7));}
async function tick(){if(busy||!sid)return;busy=true;try{const blob=await grabFrame();if(!blob)return;const fd=new FormData();fd.append('file',blob,'f.jpg');const r=await api(`/api/session/${sid}/frame`,{method:'POST',body:fd});lastOk=Date.now();fails=0;if(typeof r.person_present==='boolean')setPresence(r.person_present);
  if(r.status==='analysed'||r.status==='baseline'){if(!r.say&&r.state==='ok')quiet();}
  if(r.goal_met&&!goalDone){goalDone=true;const g=r.say||ui().uncertain;show('watch',g);speak(g);log(g);}else announce(r);
  if(r.timer_seconds)startTimer(r.timer_seconds);
  const notes=r.notices||[];if(notes.length){notes.forEach(n=>log(n.say));const top=notes.find(n=>n.state==='alert')||notes[notes.length-1];show(top.state,top.say);speak(top.say);holdUntil=Date.now()+30000;}
 }catch(e){if(e.status===404){try{await newSession();}catch(_){ }return;}fails++;if(fails>=MAX_FAILS){show('alert',ui().connection,e.message);log('Connection problem: '+e.message);}}finally{busy=false;}}
function quiet(){if(Date.now()<holdUntil)return;show('ok',ui().watching,`${ui().lastCheck} ${new Date().toLocaleTimeString()}`);}
function checkWatching(){const dead=stream&&stream.getVideoTracks().every(t=>t.readyState==='ended');const off=!!sid&&(dead||fails>=MAX_FAILS||Date.now()-lastOk>SILENCE_MS);$('offline').classList.toggle('hidden',!off);if(off&&!offShown)speak(ui().connection);offShown=off;}

$('lang').onchange=()=>{lang=$('lang').value;applyLanguage();if(sid)log(lang==='sw'?'Lugha imebadilishwa kuwa Kiswahili.':'Language changed to English.');};
$('start').onclick=async()=>{
  lang=$('lang').value;applyLanguage();code=$('code').value.trim();try{localStorage.setItem('mpishi_code',code);}catch(_){}demo=$('demo').checked;INTERVAL_MS=demo?5000:10000;goalDone=false;lastSaid='';lastSaidAt=0;
  cfg={food:$('food').value.trim(),goal:$('goal').value.trim(),preference:$('pref').value.trim(),language:lang,demo};
  speak(ui().startMessage);
  if(!window.isSecureContext){$('secure').textContent=ui().cameraSecure;$('secure').classList.remove('hidden');return;}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});}
  catch(e){$('secure').textContent=ui().cameraBlocked;$('secure').classList.remove('hidden');return;}
  $('secure').classList.add('hidden');$('start').disabled=true;$('start').textContent=ui().planning;
  try{await newSession();}catch(e){if(e.status===401)$('codeRow').classList.remove('hidden');$('secure').textContent=e.status===401?ui().wrongCode:e.message;$('secure').classList.remove('hidden');stream.getTracks().forEach(t=>t.stop());return;}finally{$('start').disabled=false;$('start').textContent=ui().start;}
  $('cam').srcObject=stream;await $('cam').play();$('setup').classList.add('hidden');$('live').classList.remove('hidden');$('demobadge').classList.toggle('hidden',!demo);lastOk=Date.now();clearInterval(watchdog);watchdog=setInterval(checkWatching,2000);
  const intro=(items[0]||{}).intro;if(intro){show('ok',intro);speak(intro);log(intro);}else show('ok',ui().starting);
  try{wake=await navigator.wakeLock?.request('screen');}catch(_){ }
  setTimeout(tick,1200);loop=setInterval(tick,INTERVAL_MS);
};
$('ask').onclick=async()=>{const q=$('q').value.trim();if(!q||!sid)return;try{const r=await api(`/api/session/${sid}/ask`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});r.say=r.say||ui().uncertain;announce(r);if(r.timer_seconds)startTimer(r.timer_seconds);$('q').value='';}catch(e){show('watch',ui().uncertain,e.message);}};
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')$('ask').click();});
$('additem').onclick=async()=>{const name=$('itemname').value.trim();if(name.length<2||!sid)return;$('additem').disabled=true;$('additem').textContent=ui().planningShort;try{const it=await api(`/api/session/${sid}/items`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,preference:''}),timeout:120000});items.push(it);renderPlan();$('itemname').value='';if(it.intro){show('ok',it.intro);speak(it.intro);log(it.intro);}}catch(e){show('watch',ui().uncertain,e.message);}finally{$('additem').disabled=false;$('additem').textContent=ui().add;}};
$('itemname').addEventListener('keydown',e=>{if(e.key==='Enter')$('additem').click();});
$('stop').onclick=async()=>{clearInterval(loop);clearInterval(timerTick);clearInterval(watchdog);$('offline').classList.add('hidden');speechSynthesis?.cancel();stream?.getTracks().forEach(t=>t.stop());try{await wake?.release();}catch(_){ }if(sid)api(`/api/session/${sid}`,{method:'DELETE'}).catch(()=>{});sid=null;stream=null;$('live').classList.add('hidden');$('setup').classList.remove('hidden');$('timer').textContent='';items=[];renderPlan();};
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&sid){try{wake=await navigator.wakeLock?.request('screen');}catch(_){ }}});
try{code=localStorage.getItem('mpishi_code')||'';$('code').value=code;}catch(_){}
fetch('/api/health').then(r=>r.json()).then(x=>{if(x.protected)$('codeRow').classList.remove('hidden');}).catch(()=>{});
applyLanguage();
</script>
